[project]
name = "irpf-automacao"
version = "1.0"
description = "Sistema RPA que automatiza a Exportação de Declarações de IRPF transmitidas e seus Recibos utilizando visão computacional entre outras ferramentas do ecosistema de python"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "mss>=10.2.0",
    "numpy>=2.4.6",
    "opencv-python>=4.13.0.92",
    "pyautogui>=0.9.54",
    "pydantic>=2.13.4",
    "pygetwindow>=0.0.9",
]
